    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39C5BB" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#7580A8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#527BFF" stop-opacity=".0"/>
